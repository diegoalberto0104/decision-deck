name: CI
on:
  push:
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check:dominio
      - run: npm run check:privado
        env:
          PRIVADO_TERMINOS: ${{ secrets.PRIVADO_TERMINOS }}
      - run: npm run lint
      - run: npm run check:ejemplos
